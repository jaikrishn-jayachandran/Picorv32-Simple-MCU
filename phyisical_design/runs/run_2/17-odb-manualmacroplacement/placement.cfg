# ============================================================
# soc_top macro placement — L-shaped digital region
#
# DIE  : 5000 x 3000 um
# DIGITAL L-SHAPE:
#     Left column : x = 50 -> 2669, y = 50 -> 2950
#     Bottom row  : x = 2669 -> 4950, y = 50 -> 700
#
# ANALOG BLACKBOX (concave corner of the L):
#     x = 2669 -> 4950, y = 700 -> 2950
#
# PERIPHERAL EDGES:
#   u_boot_spi   -> bottom edge  (SPI signals)
#   u_periph0    -> left edge    (GPIO0)
#   u_periph1    -> top edge     (GPIO1)
#   u_periph2    -> bottom row, pins facing blackbox (ADC)
# ============================================================

# CPU cluster (center-left)
u_cpu        600     900     N
u_ram       1500     900     N

# Interconnect (above CPU)
u_ic         600    1900     N

# Bottom-left: SPI boot
u_boot_spi   200     200     N

# Left edge: GPIO0
u_periph0    100    1300     N

# Top-left: GPIO1
u_periph1    200    2500     N

# Bottom row: ADC controller, pins face up toward blackbox
u_periph2   3400     200     N