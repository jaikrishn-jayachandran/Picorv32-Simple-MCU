# ============================================================
# pin_order.cfg — soc_top port placement
#
# Format:
#   #W = West / left
#   #S = South / bottom
#   #N = North / top
#   #E = East / right
#
# Strategy:
#   WEST   -> clk, reset, GPIO0
#   NORTH  -> GPIO1
#   SOUTH  -> GPIO2, SPI
# ============================================================

# ------------------------------------------------------------
# WEST
# Clock / reset / GPIO0
# ------------------------------------------------------------

#W
clk_i
rst_ni
gpio0_in\[\d+\]
gpio0_out\[\d+\]
gpio0_dir\[\d+\]

# ------------------------------------------------------------
# NORTH
# GPIO1
# ------------------------------------------------------------

#N
gpio1_in\[\d+\]
gpio1_out\[\d+\]
gpio1_dir\[\d+\]

# ------------------------------------------------------------
# SOUTH
# GPIO2 / SPI
# ------------------------------------------------------------

#S
gpio2_in\[\d+\]
gpio2_out\[\d+\]
gpio2_dir\[\d+\]

spi_cs_n
spi_sclk
spi_mosi
spi_miso