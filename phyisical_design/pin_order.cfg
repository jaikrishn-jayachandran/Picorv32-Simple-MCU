# -----------------------------------------------------------
# pin_order.cfg for soc_top  (die 2300 x 2400, notch Q3)
# Sides: N (top), S (bottom), E (right), W (left)
# Regex: \[\d+\] matches every bit-slice of a bus, in index order.
# -----------------------------------------------------------

#N
clk_i
rst_ni
spi_cs_n
spi_sclk
spi_mosi
spi_miso
#N

#W
gpio0_in\[\d+\]
gpio0_out\[\d+\]
gpio0_dir\[\d+\]
#W

#S
gpio1_in\[\d+\]
gpio1_out\[\d+\]
gpio1_dir\[\d+\]
#S

#E
gpio2_in\[\d+\]
gpio2_out\[\d+\]
gpio2_dir\[\d+\]
#E