# ============================================================
# pin_order.cfg — soc_top port placement
#
# Format:
#   #W = West / left
#   #S = South / bottom
#   #N = North / top
#   #E = East / right
#
# Strategy:
#   WEST   -> clk, reset, GPIO0
#   NORTH  -> GPIO1
#   SOUTH  -> GPIO2, SPI
# ============================================================

# ------------------------------------------------------------
# WEST
# Clock / reset / GPIO0
# ------------------------------------------------------------

#W
clk_i
rst_ni

gpio0_in*
gpio0_out*
gpio0_dir*

# ------------------------------------------------------------
# NORTH
# GPIO1
# ------------------------------------------------------------

#N
gpio1_in*
gpio1_out*
gpio1_dir*

# ------------------------------------------------------------
# SOUTH
# GPIO2 / SPI
# ------------------------------------------------------------

#S
gpio2_in*
gpio2_out*
gpio2_dir*

spi_cs_n
spi_sclk
spi_mosi
spi_miso